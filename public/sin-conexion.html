<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Mesira</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f2f3ef;
        --ink: #14262e;
        --ink-2: #5c6e77;
        --rule: #d8dcd6;
        --green: #17614b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0f1513;
          --ink: #e7ebe5;
          --ink-2: #9aa8a2;
          --rule: #2a3330;
          --green: #4e9e80;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px calc(16px + env(safe-area-inset-left, 0px));
      }
      main { max-width: 32rem; margin: 0 auto; }
      h1 {
        margin: 0;
        font-size: 1.875rem;
        line-height: 2.125rem;
        font-weight: 800;
        letter-spacing: -0.022em;
      }
      p {
        margin: 12px 0 0;
        font-size: 1rem;
        line-height: 1.625rem;
        color: var(--ink-2);
      }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 4px;
        background: var(--green);
        color: #fff;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Te quedaste sin conexión</h1>
      <p>
        No pudimos cargar el tablero. Revisá tu internet y volvé a intentar; lo que publicaste sigue
        guardado.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
